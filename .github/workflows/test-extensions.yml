name: Test DuckDB extensions

# Quick check (about 1 minute): which community extensions actually
# install AND load on linux_amd64 for each DuckDB version.

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        duckdb: ['v2.0.0', 'v2.0.1']
        extension: ['read_prs', 'read_stat']

    steps:
      - name: Download DuckDB CLI ${{ matrix.duckdb }}
        run: |
          curl -LsSf -o duckdb.tar.gz \
            https://github.com/duckdb/duckdb/releases/download/${{ matrix.duckdb }}/duckdb-cli-linux-amd64.tar.gz
          mkdir cli && tar -xzf duckdb.tar.gz -C cli
          cp "$(find cli -type f -name duckdb | head -n 1)" ./duckdb
          chmod +x ./duckdb
          ./duckdb -c "SELECT version();"

      - name: Install and load ${{ matrix.extension }}
        run: |
          ./duckdb -c "INSTALL ${{ matrix.extension }} FROM community; LOAD ${{ matrix.extension }}; SELECT extension_name, extension_version, loaded FROM duckdb_extensions() WHERE extension_name = '${{ matrix.extension }}';"
