name: Build raer

# Release:   push a tag, e.g.  git tag v4.6.2-2026.08.14 && git push --tags
#            (or create a release/tag in the GitHub web UI)
#            -> image pushed to ghcr.io/<you>/raer:<tag> and :latest, plus a GitHub Release
# Test run:  "Run workflow" under the Actions tab -> image only as a downloadable artifact

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write     # create releases
  packages: write     # push to ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest      # x86_64 / amd64
    timeout-minutes: 300

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # Install Apptainer from its official Ubuntu PPA (before freeing disk space,
      # so the package system is untouched)
      - name: Install Apptainer
        run: |
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update
          sudo apt-get install -y apptainer
          apptainer --version

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          preinstalled-runtimes: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Prepare build directories
        run: |
          sudo mkdir -p /mnt/apptainer-tmp /mnt/apptainer-cache /mnt/out
          sudo chmod 777 /mnt/out
          df -h / /mnt

      - name: Build image
        run: |
          sudo env \
            APPTAINER_TMPDIR=/mnt/apptainer-tmp \
            APPTAINER_CACHEDIR=/mnt/apptainer-cache \
            apptainer build /mnt/out/raer.sif raer.def

      - name: Check image and list R packages
        run: |
          ls -lh /mnt/out/raer.sif
          apptainer exec /mnt/out/raer.sif uname -m
          apptainer exec /mnt/out/raer.sif file /usr/local/lib/R/bin/exec/R
          apptainer exec /mnt/out/raer.sif R --version | head -n 1
          apptainer exec /mnt/out/raer.sif Rscript -e \
            "ip <- installed.packages()[, c('Package', 'Version')]; write.csv(ip, '/mnt/out/r_packages.csv', row.names = FALSE)"
          df -h / /mnt

      # ---- Test runs (no tag): downloadable artifact ----
      - name: Upload test image
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: raer-test
          path: /mnt/out/raer.sif
          compression-level: 0
          retention-days: 7

      # ---- Releases (tag): push to GitHub Container Registry + create release ----
      - name: Push image to ghcr.io
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"   # ghcr.io needs lowercase
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            apptainer registry login --username "${{ github.actor }}" --password-stdin oras://ghcr.io
          apptainer push /mnt/out/raer.sif "oras://ghcr.io/${OWNER}/raer:${GITHUB_REF_NAME}"
          apptainer push /mnt/out/raer.sif "oras://ghcr.io/${OWNER}/raer:latest"
          echo "OWNER=${OWNER}" >> "$GITHUB_ENV"

      # Release assets must be < 2 GiB each: attach the .sif directly if it fits,
      # otherwise split it into parts
      - name: Prepare release files
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          sudo rm -rf /mnt/apptainer-tmp /mnt/apptainer-cache   # free space first
          cd /mnt/out
          NAME="raer_${GITHUB_REF_NAME}.sif"
          mv raer.sif "$NAME"
          sha256sum "$NAME" > "$NAME.sha256"
          SIZE=$(stat -c %s "$NAME")
          LIMIT=$((1900 * 1024 * 1024))
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "Image is larger than 1900 MiB: splitting into parts"
            split -b 1900M -d "$NAME" "$NAME.part-"
            rm "$NAME"
          else
            echo "Image fits in one release file: no splitting"
          fi
          ls -lh /mnt/out

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            raer.def
            /mnt/out/r_packages.csv
            /mnt/out/*.sif
            /mnt/out/*.part-*
            /mnt/out/*.sha256
          body: |
            Apptainer image `raer` ${{ github.ref_name }} (linux/amd64).

            **Option A: download from this page** (no tools needed)
            - If there is a single `.sif` file below: download it and the `.sha256` file.
            - If there are `.part-*` files instead: download all of them and the `.sha256` file into one folder, then join them:
              ```
              cat raer_${{ github.ref_name }}.sif.part-* > raer_${{ github.ref_name }}.sif
              ```
            Check the download (should print "OK"):
            ```
            shasum -a 256 -c raer_${{ github.ref_name }}.sif.sha256     # macOS (Linux: sha256sum -c)
            ```

            **Option B: pull with Apptainer**
            ```
            apptainer pull raer_${{ github.ref_name }}.sif oras://ghcr.io/${{ env.OWNER }}/raer:${{ github.ref_name }}
            ```

            The def file and a list of installed R packages with versions are attached below.
