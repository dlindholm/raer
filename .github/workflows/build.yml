name: Build raer

# Automatic:  push a change to raer.def on main
#             -> builds the image and publishes a release automatically.
#             The version is read from raer.def:  v<R version>-<CRAN snapshot date>
#             e.g. "From: rocker/verse:4.6.2" + "WHEN='2026-08-14'" -> v4.6.2-2026.08.14
#             If that version already exists (e.g. you only added packages),
#             a suffix is added: v4.6.2-2026.08.14-2, -3, ...
#
# Manual:     Actions tab -> "Run workflow"
#             - "Publish a release" unticked (default): test build, image as a 7-day artifact
#             - ticked: same as the automatic release

on:
  push:
    branches: [main]
    paths: ['raer.def']
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a release (otherwise test build only)'
        type: boolean
        default: false

permissions:
  contents: write     # create releases and tags

# Never run two builds at the same time; a newer push waits for the running one
concurrency:
  group: build-raer
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest      # x86_64 / amd64
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Decide version and mode
        id: ver
        run: |
          RVER=$(grep -oP '^From:\s*rocker/\S+:\K[0-9.]+' raer.def)
          SNAP=$(grep -oP "WHEN=['\"]?\K[0-9]{4}-[0-9]{2}-[0-9]{2}" raer.def | head -n 1 | tr - .)
          if [ -z "$RVER" ] || [ -z "$SNAP" ]; then
            echo "Could not read the R version or WHEN date from raer.def" >&2
            exit 1
          fi
          BASE="v${RVER}-${SNAP}"
          TAG="$BASE"; n=1
          while gh release view "$TAG" > /dev/null 2>&1 || \
                git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null 2>&1; do
            n=$((n + 1)); TAG="${BASE}-${n}"
          done

          if [ "$GITHUB_EVENT_NAME" = "push" ] || [ "${{ inputs.release }}" = "true" ]; then
            RELEASE=true
          else
            RELEASE=false
          fi
          echo "Version: $TAG   Release: $RELEASE"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

      - name: Install Apptainer
        run: |
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update
          sudo apt-get install -y apptainer
          apptainer --version

      - name: Prepare build directories
        run: |
          sudo mkdir -p /mnt/apptainer-tmp /mnt/apptainer-cache /mnt/out
          sudo chmod 777 /mnt/out
          df -h / /mnt

      - name: Build image
        run: |
          sudo env \
            APPTAINER_TMPDIR=/mnt/apptainer-tmp \
            APPTAINER_CACHEDIR=/mnt/apptainer-cache \
            apptainer build /mnt/out/raer.sif raer.def

      # Run as root: Ubuntu 24.04 runners block unprivileged containers (AppArmor)
      - name: Check image and list R packages
        run: |
          ls -lh /mnt/out/raer.sif
          sudo apptainer exec /mnt/out/raer.sif uname -m
          sudo apptainer exec /mnt/out/raer.sif file /usr/local/lib/R/bin/exec/R
          sudo apptainer exec /mnt/out/raer.sif R --version | head -n 1
          sudo apptainer exec --bind /mnt/out /mnt/out/raer.sif Rscript -e \
            "ip <- installed.packages()[, c('Package', 'Version')]; write.csv(ip, '/mnt/out/r_packages.csv', row.names = FALSE)"
          df -h / /mnt

      # ---- Test builds: downloadable artifact ----
      - name: Upload test image
        if: steps.ver.outputs.release != 'true'
        uses: actions/upload-artifact@v5
        with:
          name: raer-test
          path: /mnt/out/raer.sif
          compression-level: 0
          retention-days: 7

      # ---- Releases: create a GitHub release with the image attached ----
      # Release assets must be < 2 GiB each: attach the .sif directly if it fits,
      # otherwise split it into parts
      - name: Prepare release files
        if: steps.ver.outputs.release == 'true'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          sudo rm -rf /mnt/apptainer-tmp /mnt/apptainer-cache   # free space first
          cd /mnt/out
          NAME="raer_${TAG}.sif"
          mv raer.sif "$NAME"
          sha256sum "$NAME" > "$NAME.sha256"
          SIZE=$(stat -c %s "$NAME")
          LIMIT=$((1900 * 1024 * 1024))
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "Image is larger than 1900 MiB: splitting into parts"
            split -b 1900M -d "$NAME" "$NAME.part-"
            rm "$NAME"
          else
            echo "Image fits in one release file: no splitting"
          fi
          ls -lh /mnt/out

      # Uses the GitHub CLI (preinstalled on the runner) instead of a Node.js action
      - name: Create GitHub release
        if: steps.ver.outputs.release == 'true'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          cat > notes.md << 'EOF'
          Apptainer image `raer` __TAG__ (linux/amd64).

          **Download from this page**
          - If there is a single `.sif` file below: download it and the `.sha256` file.
          - If there are `.part-*` files instead: download all of them and the `.sha256` file into one folder, then join them:
            ```
            cat raer___TAG__.sif.part-* > raer___TAG__.sif
            ```
          Check the download (should print "OK"). On macOS:
          ```
          shasum -a 256 -c raer___TAG__.sif.sha256
          ```
          On Linux, use `sha256sum -c` instead of `shasum -a 256 -c`.

          The def file and a list of installed R packages with versions are attached below.
          EOF
          sed -i -e "s/__TAG__/${TAG}/g" notes.md

          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
          gh release upload "$TAG" raer.def /mnt/out/r_packages.csv /mnt/out/raer_* --clobber
